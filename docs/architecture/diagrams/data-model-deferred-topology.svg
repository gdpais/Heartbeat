<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img">
<title>Data model: deferred topology</title><desc>Not yet created. Environments would contain assets; an asset optionally hosts database targets; asset_relationships link a source asset to a target asset.</desc>
<defs><style>
  text { font-family: "Anthropic Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; fill: #1f1e1b; }
  .ts { font-size: 12px; fill: #5f5e5a; }
  .group { fill: none; stroke: #b4b2a9; stroke-width: 0.75; }
  .rel { fill: none; stroke: #73726c; stroke-width: 1.25; }
  .opt { stroke-dasharray: 4 3; }
  .mark { fill: none; stroke: #73726c; stroke-width: 1.25; }
  .c-blue > rect { fill: #e6f1fb; stroke: #185fa5; }
  .c-blue > .th { fill: #0c447c; }
  .c-gray > rect { fill: #f1efe8; stroke: #5f5e5a; }
  .c-gray > .th { fill: #444441; }
  .c-gray > .ts { fill: #5f5e5a; }
  @media (prefers-color-scheme: dark) {
    .th { fill: #f0eee6; }
    .ts { fill: #b4b2a9; }
    .group { stroke: #5f5e5a; }
    .rel, .mark { stroke: #9c9a92; }
    .c-blue > rect { fill: #0c447c; stroke: #85b7eb; }
    .c-blue > .th { fill: #e6f1fb; }
    .c-gray > rect { fill: #444441; stroke: #b4b2a9; }
    .c-gray > .th { fill: #f1efe8; }
    .c-gray > .ts { fill: #d3d1c7; }
  }
</style><marker id="hb-er-topo-one" viewBox="0 0 12 12" refX="0" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="mark" d="M6 1 L6 11"/></marker><marker id="hb-er-topo-many" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="mark" d="M12 1 L2 6 L12 11 M2 6 L12 6"/></marker></defs>
<g class="c-blue"><rect x="120" y="60" width="150" height="40" rx="4" stroke-width="0.5"/>
<text class="th" x="195" y="80" text-anchor="middle" dominant-baseline="central">environments</text></g>
<g class="c-gray"><rect x="360" y="60" width="150" height="40" rx="4" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="435" y="80" text-anchor="middle" dominant-baseline="central">assets</text></g>
<g class="c-blue"><rect x="600" y="60" width="178" height="40" rx="4" stroke-width="0.5"/>
<text class="th" x="689" y="80" text-anchor="middle" dominant-baseline="central">database_targets</text></g>
<g class="c-gray"><rect x="335" y="170" width="200" height="40" rx="4" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="435" y="190" text-anchor="middle" dominant-baseline="central">asset_relationships</text></g>
<path class="rel" d="M270 80 L360 80" marker-start="url(#hb-er-topo-one)" marker-end="url(#hb-er-topo-many)"/>
<path class="rel opt" d="M510 80 L600 80" marker-start="url(#hb-er-topo-one)" marker-end="url(#hb-er-topo-many)"/>
<path class="rel" d="M405 100 L405 170" marker-start="url(#hb-er-topo-one)" marker-end="url(#hb-er-topo-many)"/>
<path class="rel" d="M465 100 L465 170" marker-start="url(#hb-er-topo-one)" marker-end="url(#hb-er-topo-many)"/>
<text class="ts" x="397" y="135" text-anchor="end" dominant-baseline="central">source</text>
<text class="ts" x="473" y="135" text-anchor="start" dominant-baseline="central">target</text>
<g class="c-blue"><rect x="40" y="226" width="12" height="12" rx="2" stroke-width="0.5"/></g>
<text class="ts" x="58" y="232" text-anchor="start" dominant-baseline="central">Table (migrated)</text>
<g class="c-gray"><rect x="189" y="226" width="12" height="12" rx="2" stroke-width="0.5" stroke-dasharray="2 2"/></g>
<text class="ts" x="207" y="232" text-anchor="start" dominant-baseline="central">Deferred, not created</text>
<path class="rel" d="M371 232 L405 232" marker-start="url(#hb-er-topo-one)" marker-end="url(#hb-er-topo-many)"/>
<text class="ts" x="413" y="232" text-anchor="start" dominant-baseline="central">One to many</text>
<path class="rel opt" d="M511 232 L545 232" marker-start="url(#hb-er-topo-one)" marker-end="url(#hb-er-topo-many)"/>
<text class="ts" x="553" y="232" text-anchor="start" dominant-baseline="central">Optional (nullable) reference</text>
</svg>
