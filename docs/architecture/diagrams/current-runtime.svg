<line class="gap" x1="426" y1="224" x2="426" y2="250" marker-end="url(#hb-runtime-gap)"/>
<line class="arr" x1="362" y1="294" x2="328" y2="294" marker-end="url(#hb-runtime-arrow)"/>
<line class="arr" x1="490" y1="112" x2="524" y2="112" marker-end="url(#hb-runtime-arrow)"/>
<line class="arr" x1="490" y1="196" x2="524" y2="196" marker-end="url(#hb-runtime-arrow)"/>
<line class="arr" x1="682" y1="154" x2="718" y2="154" marker-end="url(#hb-runtime-arrow)"/>
<g class="c-blue"><rect x="40" y="350" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="58" y="356" dominant-baseline="central">Implemented</text>
<g class="c-amber"><rect x="150" y="350" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="168" y="356" dominant-baseline="central">Partial</text>
<g class="c-gray"><rect x="226" y="350" width="12" height="12" rx="2" stroke-width="0.5" stroke-dasharray="2 2"/></g><text class="ts" x="244" y="356" dominant-baseline="central">Idle</text>
<g class="c-gray"><rect x="292" y="350" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="310" y="356" dominant-baseline="central">External and people</text>
<line class="gap" x1="450" y1="356" x2="480" y2="356"/><text class="ts" x="488" y="356" dominant-baseline="central">Known gap: Prometheus has no alerting block</text>
