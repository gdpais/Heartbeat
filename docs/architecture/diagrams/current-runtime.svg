<g class="c-amber"><rect x="150" y="440" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="168" y="446" dominant-baseline="central">Partial</text>
<g class="c-gray"><rect x="226" y="440" width="12" height="12" rx="2" stroke-width="0.5"/></g><text class="ts" x="244" y="446" dominant-baseline="central">External and people</text>
