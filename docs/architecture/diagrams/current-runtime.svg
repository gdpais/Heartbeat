<svg xmlns="http://www.w3.org/2000/svg" width="840" height="476" viewBox="0 0 840 476" role="img"><title>Heartbeat current runtime, left to right</title><desc>Left to right: OTLP clients push to the OTel Collector and SQL Server targets are pulled by the DB collector, inside the Kubernetes monitoring environment deployed by the Helm chart. The OTel Collector sends logs to Loki; Prometheus scrapes the OTel Collector, DB collector and OTel gateway. Prometheus sends alerts to Alertmanager, which sends its webhook to the OTel gateway and routes the always-firing Watchdog alert to an external dead-man's switch. Loki and Prometheus feed Grafana, which the operator reads.</desc><defs><style>
  text { font-family: "Anthropic Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; fill: #1f1e1b; }
  .ts { font-size: 12px; fill: #5f5e5a; }
  .group { fill: none; stroke: #b4b2a9; stroke-width: 0.75; }
  .arr { fill: none; stroke: #73726c; stroke-width: 1.5; }
  .gap { fill: none; stroke: #ba7517; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .head { fill: none; stroke: #73726c; }
  .head-gap { fill: none; stroke: #ba7517; }
  .c-blue > rect { fill: #e6f1fb; stroke: #185fa5; }
  .c-blue > .th { fill: #0c447c; }
  .c-blue > .ts { fill: #185fa5; }
  .c-amber > rect { fill: #faeeda; stroke: #854f0b; }
  .c-amber > .th { fill: #633806; }
  .c-amber > .ts { fill: #854f0b; }
  .c-gray > rect { fill: #f1efe8; stroke: #5f5e5a; }
  .c-gray > .th { fill: #444441; }
  .c-gray > .ts { fill: #5f5e5a; }
  @media (prefers-color-scheme: dark) {
    .th { fill: #f0eee6; }
    .ts { fill: #b4b2a9; }
    .group { stroke: #5f5e5a; }
    .arr, .head { stroke: #9c9a92; }
    .gap, .head-gap { stroke: #ef9f27; }
    .c-blue > rect { fill: #0c447c; stroke: #85b7eb; }
    .c-blue > .th { fill: #e6f1fb; }
    .c-blue > .ts { fill: #b5d4f4; }
    .c-amber > rect { fill: #633806; stroke: #ef9f27; }
    .c-amber > .th { fill: #faeeda; }
    .c-amber > .ts { fill: #fac775; }
    .c-gray > rect { fill: #444441; stroke: #b4b2a9; }
    .c-gray > .th { fill: #f1efe8; }
    .c-gray > .ts { fill: #d3d1c7; }
  }
</style><marker id="hb-runtime-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="hb-runtime-gap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head-gap" d="M2 1L8 5L2 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="84" width="112" height="56" rx="4" stroke-width="0.5"/><text class="th" x="96" y="104" text-anchor="middle" dominant-baseline="central">OTLP clients</text><text class="ts" x="96" y="122" text-anchor="middle" dominant-baseline="central">pushed</text></g>
<g class="c-gray"><rect x="40" y="168" width="112" height="56" rx="4" stroke-width="0.5"/><text class="th" x="96" y="188" text-anchor="middle" dominant-baseline="central">SQL Server</text><text class="ts" x="96" y="206" text-anchor="middle" dominant-baseline="central">pulled</text></g>
<rect class="group" x="180" y="40" width="516" height="288" rx="8" stroke-dasharray="5 4"/>
<text class="th" x="194" y="62" dominant-baseline="central">Monitoring environment · Kubernetes (Helm)</text>
<g class="c-blue"><rect x="194" y="84" width="132" height="56" rx="4" stroke-width="0.5"/><text class="th" x="260" y="104" text-anchor="middle" dominant-baseline="central">OTel Collector</text><text class="ts" x="260" y="122" text-anchor="middle" dominant-baseline="central">:4317 · :4318</text></g>
<g class="c-blue"><rect x="194" y="168" width="132" height="56" rx="4" stroke-width="0.5"/><text class="th" x="260" y="188" text-anchor="middle" dominant-baseline="central">DB collector</text><text class="ts" x="260" y="206" text-anchor="middle" dominant-baseline="central">:8082 · probes</text></g>
<g class="c-amber"><rect x="194" y="252" width="132" height="56" rx="4" stroke-width="0.5"/><text class="th" x="260" y="272" text-anchor="middle" dominant-baseline="central">OTel gateway</text><text class="ts" x="260" y="290" text-anchor="middle" dominant-baseline="central">no caller yet</text></g>
<g class="c-blue"><rect x="362" y="84" width="128" height="56" rx="4" stroke-width="0.5"/><text class="th" x="426" y="104" text-anchor="middle" dominant-baseline="central">Loki</text><text class="ts" x="426" y="122" text-anchor="middle" dominant-baseline="central">logs from OTel</text></g>
<g class="c-blue"><rect x="362" y="168" width="128" height="56" rx="4" stroke-width="0.5"/><text class="th" x="426" y="188" text-anchor="middle" dominant-baseline="central">Prometheus</text><text class="ts" x="426" y="206" text-anchor="middle" dominant-baseline="central">15s scrape, rules</text></g>
<g class="c-blue"><rect x="362" y="252" width="128" height="56" rx="4" stroke-width="0.5"/><text class="th" x="426" y="272" text-anchor="middle" dominant-baseline="central">Alertmanager</text><text class="ts" x="426" y="290" text-anchor="middle" dominant-baseline="central">webhook · Watchdog</text></g>
<g class="c-blue"><rect x="526" y="84" width="156" height="140" rx="4" stroke-width="0.5"/><text class="th" x="604" y="136" text-anchor="middle" dominant-baseline="central">Grafana</text><text class="ts" x="604" y="156" text-anchor="middle" dominant-baseline="central">PromQL · LogQL</text><text class="ts" x="604" y="174" text-anchor="middle" dominant-baseline="central">dashboards · Explore</text></g>
<g class="c-gray"><rect x="520" y="356" width="170" height="56" rx="4" stroke-width="0.5"/><text class="th" x="605" y="376" text-anchor="middle" dominant-baseline="central">Dead-man's switch</text><text class="ts" x="605" y="394" text-anchor="middle" dominant-baseline="central">healthchecks.io in prod</text></g>
<g class="c-gray"><rect x="720" y="126" width="80" height="56" rx="4" stroke-width="0.5"/><text class="th" x="760" y="146" text-anchor="middle" dominant-baseline="central">Operator</text><text class="ts" x="760" y="164" text-anchor="middle" dominant-baseline="central">SRE</text></g>
