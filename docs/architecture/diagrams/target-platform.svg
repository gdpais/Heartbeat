<svg xmlns="http://www.w3.org/2000/svg" width="880" height="690" viewBox="0 0 880 690" role="img"><title>Heartbeat target platform, landscape</title><desc>Telemetry across the top: SQL Server targets and planned OutSystems apps feed the collectors, which feed the stores (Prometheus and Loki); the stores send alerts to Alertmanager; Alertmanager sends an alert webhook back to the collectors and will notify email and webhooks. Below, left to right: Presentation (Grafana fed by the stores, and the planned React web UI), Analysis jobs (session analyzer querying the stores, reporting and report storage) and the Control plane (PostgreSQL, planned Go API and Redis, YAML config). The Go API pushes policy rules to the stores and routes to Alertmanager, stores metadata in PostgreSQL, enqueues jobs in Redis and serves the web UI over HTTPS. Analysis writes summaries to PostgreSQL and takes jobs from Redis. The operator uses Grafana and the web UI.</desc><defs><style>
  text { font-family: "Anthropic Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; fill: #1f1e1b; }
  .ts { font-size: 12px; fill: #5f5e5a; }
  .group { fill: none; stroke: #b4b2a9; stroke-width: 0.75; }
  .arr { fill: none; stroke: #73726c; stroke-width: 1.5; }
  .gap { fill: none; stroke: #ba7517; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .head { fill: none; stroke: #73726c; }
  .head-gap { fill: none; stroke: #ba7517; }
  .c-blue > rect { fill: #e6f1fb; stroke: #185fa5; }
  .c-blue > .th { fill: #0c447c; }
  .c-blue > .ts { fill: #185fa5; }
  .c-amber > rect { fill: #faeeda; stroke: #854f0b; }
  .c-amber > .th { fill: #633806; }
  .c-amber > .ts { fill: #854f0b; }
  .c-gray > rect { fill: #f1efe8; stroke: #5f5e5a; }
  .c-gray > .th { fill: #444441; }
  .c-gray > .ts { fill: #5f5e5a; }
  @media (prefers-color-scheme: dark) {
    .th { fill: #f0eee6; }
    .ts { fill: #b4b2a9; }
    .group { stroke: #5f5e5a; }
    .arr, .head { stroke: #9c9a92; }
    .gap, .head-gap { stroke: #ef9f27; }
    .c-blue > rect { fill: #0c447c; stroke: #85b7eb; }
    .c-blue > .th { fill: #e6f1fb; }
    .c-blue > .ts { fill: #b5d4f4; }
    .c-amber > rect { fill: #633806; stroke: #ef9f27; }
    .c-amber > .th { fill: #faeeda; }
    .c-amber > .ts { fill: #fac775; }
    .c-gray > rect { fill: #444441; stroke: #b4b2a9; }
    .c-gray > .th { fill: #f1efe8; }
    .c-gray > .ts { fill: #d3d1c7; }
  }
</style><marker id="hb-target-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="hb-target-gap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head-gap" d="M2 1L8 5L2 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="60" y="40" width="112" height="56" rx="4" stroke-width="0.5"/><text class="th" x="116" y="60" text-anchor="middle" dominant-baseline="central">SQL Server</text><text class="ts" x="116" y="78" text-anchor="middle" dominant-baseline="central">targets, pulled</text></g>
