apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-collector
  namespace: heartbeat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-collector
  template:
    metadata:
      labels:
        app: db-collector
    spec:
      # Covers the bounded shutdown: HTTP drain 10s + poller stop 20s + 5s.
      terminationGracePeriodSeconds: 45
      containers:
        - name: db-collector
          image: heartbeat/db-collector:local
          imagePullPolicy: IfNotPresent
          env:
            - name: HEARTBEAT_DB_COLLECTOR_LISTEN_ADDR
              value: :8082
            - name: HEARTBEAT_INTEGRATIONS_PATH
              value: /app/config/integrations.yaml
            - name: HEARTBEAT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: heartbeat-runtime
                  key: admin-token
            - name: HEARTBEAT_CONFIG_WATCH_INTERVAL
              value: 5s
          ports:
            - containerPort: 8082
          # Liveness only checks the process: a monitored database outage must
          # never restart the collector. Readiness reports whether the
          # collectors are actually cycling (see /readyz reasons).
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8082
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: heartbeat-config
---
apiVersion: v1
kind: Service
metadata:
  name: db-collector
  namespace: heartbeat
spec:
  selector:
    app: db-collector
  ports:
    - port: 8082
      targetPort: 8082
