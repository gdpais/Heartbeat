# The db-collector's config reload alert, in a file of its own so the chart
# can leave it out: prometheusRules.configReloadAlert.enabled=false (values.yaml).
groups:
  - name: heartbeat-config-reload-alerts
    rules:
      # A rejected reload keeps the last good config running and the pod
      # ready, so nothing else shows it. The gauge stays 0 until a reload
      # succeeds, so a short for only skips a mistake fixed at once.
      - alert: HeartbeatCollectorConfigReloadFailed
        expr: heartbeat_collector_config_last_reload_successful == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "db-collector {{ $labels.instance }} did not apply its last config change"
          description: "The db-collector rejected or could not apply its last config reload and still runs the last good config: the change has not taken effect. The reason is last_reload_err in GET /admin/config, and the \"config reload rejected\" or \"config reload failed\" line in the pod log. Fix the config and apply it again; the alert clears on the next successful reload. If the file itself is invalid, a restarted pod does not start until it is fixed."
