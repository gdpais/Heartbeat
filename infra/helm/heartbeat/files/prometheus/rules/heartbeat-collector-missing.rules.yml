# The db-collector's missing-target alert, in a file of its own so the chart
# can leave it out: it is included only when the release has the db-collector
# and the bundled Prometheus scrapes its job, the one case where the job's
# name is known. Anywhere else nothing matches and it would fire for good.
groups:
  - name: heartbeat-collector-missing-alerts
    rules:
      # Prometheus finds the db-collector through DNS on its headless Service
      # (values.yaml, prometheus.scrapeConfigs.db-collector). With no pod,
      # scaled to 0 or never scheduled, there is no target and no up series,
      # so the up == 0 rule in heartbeat.rules.yml cannot fire. Same alert and
      # labels: a missing collector is a collector down. (Where a name on
      # Prometheus' DNS search path fails instead of answering NXDOMAIN,
      # Prometheus keeps the target it last found, which fails: then the
      # up == 0 rule fires, and this one does not.)
      - alert: HeartbeatServiceDown
        expr: absent(up{job="db-collector"})
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Heartbeat service {{ $labels.job }} is down"
          description: "Prometheus has found no db-collector pod to scrape for at least 2 minutes: its StatefulSet runs no pod. Nothing is collected from SQL Server or the OutSystems logging databases meanwhile; once it is back, the OutSystems log types resume from their saved watermarks."
