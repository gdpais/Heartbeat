# Heartbeat chart defaults. Environment files in infra/helm/values/ override
# them: kind.yaml (local and CI), minimal.yaml, sqlserver-dev.yaml and
# production.example.yaml.
#
# Rules this chart follows (ADR 0003, ADR 0005):
# - One release per namespace. Object names are fixed (db-collector,
#   prometheus, loki, ...) so in-cluster endpoints match integrations.yaml.
# - Rendering is deterministic: no random values, no lookups, no hooks. Secrets
#   are created outside the chart and referenced by name.
# - The chart does not create its namespace.

# ---------------------------------------------------------------------------
# Heartbeat workloads
# ---------------------------------------------------------------------------

dbCollector:
  enabled: true
  # The collector is a singleton: replicas are fixed at 1 until replicas can
  # share targets safely (ADR 0003). There is deliberately no replicas value.
  image:
    # Where the release workflow publishes it (tests/chart_release_test.go).
    repository: ghcr.io/gdpais/heartbeat/db-collector
    # Defaults to the chart appVersion. Production pins a digest instead.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Secret holding the bearer token for the admin endpoints (GET /admin/config
  # and POST /admin/config/reload). Without it both answer 401.
  adminToken:
    existingSecret: heartbeat-runtime
    key: admin-token
  # Secret whose keys are HEARTBEAT_CREDENTIAL_<REF> variables, loaded with
  # envFrom (docs/reference/configuration.md#credential-resolution). Empty
  # means no SQL Server credentials are mounted.
  credentials:
    existingSecret: ""
  # How often the collector re-reads the mounted integrations.yaml. ConfigMap
  # updates reach the pod after kubelet propagation (up to about a minute).
  configWatchInterval: 5s
  sqlserver:
    # Trusts any server certificate. Only for throwaway local targets.
    trustServerCertificate: false
  # State that must survive a restart, mounted at /var/lib/heartbeat
  # (HEARTBEAT_STATE_DIR): the outsystems_logs watermarks, a few hundred bytes
  # per collector, target and log type. Without it, or with enabled: false
  # (an emptyDir), a restarted collector starts each log type over from its
  # initial_lookback. The claim is db-collector-state; the size can grow
  # later if the StorageClass allows volume expansion.
  persistence:
    enabled: true
    size: 256Mi
    # Empty uses the cluster's default StorageClass.
    storageClassName: ""
  # Covers the bounded shutdown: HTTP drain 10s + poller stop 20s + 5s.
  terminationGracePeriodSeconds: 45
  service:
    type: ClusterIP
    port: 8082
    # Only used when type is NodePort.
    nodePort: null
    # Only used when type is NodePort or LoadBalancer. Local keeps the
    # client's source address, so the NetworkPolicy can tell traffic from
    # outside the cluster apart from pods.
    externalTrafficPolicy: null
  # Ingress NetworkPolicy for the collector's port 8082 (metrics, health and
  # the admin endpoints). Only the bundled Prometheus (when prometheus.enabled)
  # and the peers below may connect; everything else, including other pods in
  # the namespace, is dropped. Kubelet probes and `kubectl port-forward` are
  # not subject to NetworkPolicy and need no entry. Peers are Kubernetes
  # NetworkPolicyPeer objects (podSelector, namespaceSelector, ipBlock). With
  # no peers at all, all ingress is denied. Needs a CNI that enforces
  # NetworkPolicy (kind's kindnet, Amazon VPC CNI with network policy on,
  # Calico, Cilium); without one it is accepted and has no effect.
  networkPolicy:
    enabled: true
    # Metrics scrapers other than the bundled Prometheus: a shared Prometheus,
    # or an OpenTelemetry Collector or agent that scrapes /metrics for another
    # platform (ADR 0011). When it runs in another namespace, put a namespaceSelector
    # and a podSelector in the same peer (two separate peers would admit the
    # whole namespace, or matching pods in this one). Peers that are only an
    # empty podSelector or namespaceSelector (every pod) are rejected.
    scrapers: []
    # Operator access from outside the cluster or from tooling pods, such as
    # an ipBlock for the VPN or bastion range.
    operators: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Go's soft memory limit (GOMEMLIMIT), such as 200MiB, or "off". Empty sets
  # it to 80% of resources.limits.memory, or leaves it unset without a limit.
  goMemLimit: ""
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Pod and container hardening for the Heartbeat workloads. The images
# are distroless and run as the nonroot user. fsGroup makes the collector's
# state volume writable by that user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# The complete integrations.yaml for this environment, rendered into the
# heartbeat-integrations ConfigMap. It must pass the integrations schema
# (values.schema.json embeds packages/config-schema/src/integrations.schema.json)
# and the Go loader (tests/chart_values_test.go). Lists replace, not merge,
# when an environment file sets them.
integrations:
  platform: grafana
  dashboards:
    base_url: http://localhost:3001
    dashboard_templates:
      sqlserver-overview: /d/sqlserver-overview
      heartbeat-overview: /d/heartbeat-overview
      outsystems-overview: /d/outsystems-overview
    deep_link_templates:
      logs-explore: /explore?orgId=1&left=${logs_query}
      sqlserver-target: /d/sqlserver-overview?var-target=${target}
  logs:
    base_url: http://localhost:3100
  alerting:
    base_url: http://localhost:9093
  opentelemetry:
    endpoint: http://otel-collector:4318
  notification_channels:
    - id: default-webhook
      channel_type: webhook
      target_ref: http://alertmanager:9093/api/v2/alerts
      credential_ref: env/HEARTBEAT_WEBHOOK_TOKEN
      config:
        timeout: 10s
  credential_refs:
    sqlserver-default: env/HEARTBEAT_SQLSERVER_PASSWORD
    webhook-default: env/HEARTBEAT_WEBHOOK_TOKEN
  collectors:
    - id: sqlserver-default
      kind: sqlserver
      enabled: true
      credential_ref: kv/sqlserver-default
      config:
        environment: local
        scrape_interval: 30s
        target_names: []
        probes:
          - name: waits
          - name: blocking
          - name: sessions
          - name: memory_pressure
          - name: storage
          - name: throughput
          - name: cpu
          - name: buffer_cache
          - name: file_io
        targets: []

# Heartbeat content shipped as ConfigMaps. They are created even when the
# bundled engines are off, so shared Prometheus and Grafana instances can load
# them (Grafana's dashboard sidecar finds them by the grafana_dashboard label).
prometheusRules:
  enabled: true
grafanaDashboards:
  enabled: true

# Ingress NetworkPolicies for the bundled engines [9.6], one per engine that
# is on: otel-collector, prometheus, alertmanager and loki. Only the
# components that use an engine may connect, on the ports they use; every
# other pod, in this namespace or another, is dropped:
#   otel-collector  4318 (OTLP/HTTP) from the db-collector; 8889 (its
#                   Prometheus exporter) from Prometheus
#   prometheus      9090 from Grafana (datasource)
#   alertmanager    9093 from Prometheus (alerts and its scrape)
#   loki            3100 from the OTel Collector (OTLP), Grafana (datasource)
#                   and Prometheus (its scrape); gRPC 9095 and memberlist 7946
#                   from Loki itself
# A component that is off, or a scrape job that is disabled, is not admitted.
# Grafana gets no policy: whatever serves its UI (an ingress, a load
# balancer, the operator) must reach it, and its login is the access control
# (ADR 0012). Kubelet probes and `kubectl port-forward` are not subject to
# NetworkPolicy; port-forward is how operators reach Loki and the others
# directly. Like dbCollector.networkPolicy, it needs a CNI that enforces
# NetworkPolicy.
backendNetworkPolicies:
  enabled: true
  # extraPeers: more NetworkPolicyPeer objects (podSelector,
  # namespaceSelector, ipBlock) admitted to the engine's ports, such as a
  # shared Grafana or Prometheus, or operator ranges. For a peer in another
  # namespace, put the namespaceSelector and the podSelector in one peer (two
  # peers would admit the whole namespace, or matching pods in this one).
  # Peers that are only an empty selector are rejected.
  otelCollector:
    # Admitted to 4317 and 4318 (OTLP gRPC and HTTP), and 8889 when the
    # prom-exporter port is on.
    extraPeers: []
  prometheus:
    # Admitted to 9090.
    extraPeers: []
  alertmanager:
    # Admitted to 9093.
    extraPeers: []
  loki:
    # Admitted to 3100 (push, query and metrics).
    extraPeers: []

# ---------------------------------------------------------------------------
# Third-party engines (pinned dependencies, see Chart.yaml)
# ---------------------------------------------------------------------------

prometheus:
  enabled: true
  # Static and DNS service discovery only: no cluster-wide RBAC.
  rbac:
    create: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  configmapReload:
    prometheus:
      # Reload on rule changes too, not only prometheus.yml.
      extraConfigmapMounts:
        - name: heartbeat-rules
          mountPath: /etc/prometheus-rules
          configMap: heartbeat-prometheus-rules
          readOnly: true
      extraVolumeDirs:
        - /etc/prometheus-rules
  server:
    fullnameOverride: prometheus
    retention: 15d
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    # Prometheus -> Alertmanager. Static, so no Kubernetes discovery RBAC.
    alertmanagers:
      - static_configs:
          - targets: ["alertmanager:9093"]
    extraConfigmapMounts:
      - name: heartbeat-rules
        mountPath: /etc/prometheus-rules
        configMap: heartbeat-prometheus-rules
        readOnly: true
    persistentVolume:
      enabled: true
      size: 8Gi
    service:
      type: ClusterIP
      servicePort: 9090
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  serverFiles:
    prometheus.yml:
      rule_files:
        - /etc/prometheus-rules/*.yml
  # Keyed by job name so environment files can disable or add single jobs.
  scrapeConfigs:
    kubernetes-api-servers: {enabled: false}
    kubernetes-nodes: {enabled: false}
    kubernetes-nodes-cadvisor: {enabled: false}
    kubernetes-service-endpoints: {enabled: false}
    kubernetes-service-endpoints-slow: {enabled: false}
    prometheus-pushgateway: {enabled: false}
    kubernetes-services: {enabled: false}
    kubernetes-pods: {enabled: false}
    kubernetes-pods-slow: {enabled: false}
    # The headless Service publishes the collector even while it is unready, so
    # an unready collector is still scraped and its failure metrics are kept.
    db-collector:
      dns_sd_configs:
        - names: ["db-collector-headless"]
          type: A
          port: 8082
    otel-collector:
      static_configs:
        - targets: ["otel-collector:8889"]
    alertmanager:
      static_configs:
        - targets: ["alertmanager:9093"]
    loki:
      static_configs:
        - targets: ["loki:3100"]

  alertmanager:
    enabled: true
    fullnameOverride: alertmanager
    persistence:
      enabled: true
      size: 1Gi
    service:
      type: ClusterIP
      port: 9093
    config:
      global: {}
      templates: []
      route:
        receiver: default
        group_by: ["alertname", "job", "environment"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          # The Watchdog alert always fires. An external dead-man's switch
          # notifies when it stops arriving (ADR 0005). Defaults to a receiver
          # with no integrations; production points it at healthchecks.io.
          - receiver: deadmans-switch
            matchers: ['alertname="Watchdog"']
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 1m
      # Neither receiver has an integration (ADR 0009): alerts stay visible in
      # Alertmanager and Grafana, and each environment adds its own receivers.
      receivers:
        - name: default
        - name: deadmans-switch

grafana:
  enabled: true
  fullnameOverride: grafana
  # Created outside the chart (ADR 0005); keys admin-user and admin-password.
  admin:
    existingSecret: grafana-admin
  # Dashboards come from ConfigMaps, so Grafana needs no Kubernetes API access.
  rbac:
    create: false
  testFramework:
    enabled: false
  # Stateless: dashboards and datasources come from source.
  persistence:
    enabled: false
  service:
    type: ClusterIP
    port: 3000
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://loki:3100
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: heartbeat
          orgId: 1
          folder: Heartbeat
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/heartbeat
  dashboardsConfigMaps:
    heartbeat: heartbeat-dashboards
  grafana.ini:
    analytics:
      check_for_updates: false
      reporting_enabled: false
    auth.anonymous:
      enabled: false
    # Grafana 13 gzips every response, health probes included, with a
    # parallel writer that allocates buffers per CPU.  A dashboard on a 5 s
    # refresh churned hundreds of MB a minute, the garbage collector
    # thrashed and the pod was OOM-killed.  Responses stay in the cluster
    # or on loopback; an ingress can compress if one is needed.
    server:
      enable_gzip: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

loki:
  enabled: true
  fullnameOverride: loki
  deploymentMode: Monolithic
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      max_label_names_per_series: 15
      max_label_value_length: 256
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      # Active users and sessions are distinct counts in LogQL
      # (count(sum by (Session_Id) ...)): one series per session in the
      # window.  Loki's default of 500 fails the panel once a 5-minute window
      # holds more sessions; an instant count series is a few hundred bytes.
      max_query_series: 20000
      # OTLP label policy: only these resource attributes become index labels.
      # Everything else, including user, session and request IDs, is kept as
      # structured metadata, which is queryable but not indexed.
      otlp_config:
        resource_attributes:
          ignore_defaults: true
          attributes_config:
            - action: index_label
              attributes:
                - service.name
                - service.namespace
                - deployment.environment.name
                # OutSystems 11 log type (error, screen, ...): eight values.
                - outsystems.log_type
  # Namespaced RBAC only.
  rbac:
    namespaced: true
  singleBinary:
    replicas: 1
    sidecar: false
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  gateway:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  memcached:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false

# Disk for the OTel Collector's logs export queue (file_storage/export-queue
# below), so rows the Collector accepted survive a restart: the db-collector
# has already moved its watermark past them. The claim is
# otel-collector-queue, mounted through otelCollector.extraVolumes. To run
# without one (no StorageClass), set enabled: false and make the export-queue
# volume an emptyDir; the queue then survives a container restart but not a
# new pod. The queue holds one request, a few MiB; 1Gi is the smallest gp3
# volume.
otelCollectorQueue:
  persistence:
    enabled: true
    size: 1Gi
    # Empty uses the cluster's default StorageClass.
    storageClassName: ""

otelCollector:
  enabled: true
  fullnameOverride: otel-collector
  # A one-replica StatefulSet, like the db-collector: the replacement pod is
  # not created until the old one is gone, so two Collectors never open the
  # export queue at once. A Deployment starts the replacement of an evicted
  # pod while the old one still runs. The queue is a plain claim, not a
  # volumeClaimTemplate, which could never change on an existing StatefulSet.
  # As a StatefulSet the subchart names its ConfigMap otel-collector-statefulset
  # and labels the pods component: statefulset-collector.
  mode: statefulset
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
  command:
    name: otelcol-contrib
  # The image runs as user 10001. fsGroup makes the export queue's volume
  # writable by it (kind's local-path volumes are world-writable anyway).
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  extraVolumes:
    - name: export-queue
      persistentVolumeClaim:
        claimName: otel-collector-queue
  extraVolumeMounts:
    - name: export-queue
      mountPath: /var/lib/otelcol/export-queue
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  ports:
    jaeger-compact: {enabled: false}
    jaeger-thrift: {enabled: false}
    jaeger-grpc: {enabled: false}
    zipkin: {enabled: false}
    prom-exporter:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP
  # The complete Collector config, used as is. Not `config`: as a subchart,
  # Helm drops `null` overrides of the chart's defaults whenever another values
  # file sets otelCollector keys, which brought back the jaeger, zipkin and
  # prometheus receivers and a traces pipeline. The chart offers
  # alternateConfig for this; it is never merged with the defaults.
  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      # The logs exporter's queue, on the export-queue volume
      # (otelCollectorQueue). fsync on every write: the db-collector moves its
      # watermark as soon as a batch is queued, so a node crash must not lose
      # or corrupt it. It costs a few disk syncs per OTLP request and per
      # exported batch, a few per second during a backlog.
      file_storage/export-queue:
        directory: /var/lib/otelcol/export-queue
        fsync: true
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318
    processors:
      # A percentage of resources.limits.memory.
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
          - key: heartbeat.source
            value: otel-collector
            action: upsert
      batch: {}
    exporters:
      debug: {}
      prometheus:
        endpoint: ${env:MY_POD_IP}:8889
      # Loki's native OTLP ingestion; loki.limits_config.otlp_config decides
      # which resource attributes become index labels. Named for its role, not
      # its backend: another platform's values repoint it (ADR 0011), since
      # alternateConfig is merged and a null override does not remove it.
      otlp_http/logs:
        endpoint: http://loki:3100/otlp
        # Loki rejects for good a row more than half its max_chunk_age (1h)
        # behind the newest row of its stream. Batches exported in parallel,
        # or a throttled one retried after later ones, arrive out of order
        # during a backlog (after an outage, on a first start) and lost rows
        # the db-collector had already counted delivered. So one consumer
        # exports the batches in order, and a throttled batch is retried
        # until Loki takes it. A push larger than Loki's
        # ingestion_burst_size_mb (6) is never taken, so batches are cut at
        # 4 MiB.
        #
        # The queue holds one request, on disk (file_storage/export-queue).
        # A queue that holds more loses the order across a restart: it
        # sends the requests it was sending when it stopped after the rest,
        # and Loki rejects their rows when it already has rows of the same
        # stream more than an hour newer (with 64 MiB, 1,297 of 6,000 rows
        # spanning three hours in the kind test). With one request nothing
        # queues behind the one being sent, so after a restart it is sent
        # first. The queue then buffers nothing: block_on_overflow keeps the
        # next request waiting in the receiver until Loki has taken the one
        # before, and the db-collector waits for it, its extraction paused
        # but its target up (heartbeat_outsystems_export_blocked). The disk
        # still matters: the request being sent survives a restart, and the
        # db-collector has already moved its watermark past it.
        sending_queue:
          storage: file_storage/export-queue
          num_consumers: 1
          sizer: requests
          queue_size: 1
          block_on_overflow: true
          # The batcher only cuts requests at 4 MiB: with one request in
          # the queue there is nothing to merge, and a min_size (8 KiB by
          # default) would hold every small request for flush_timeout.
          batch:
            flush_timeout: 1s
            sizer: bytes
            min_size: 0
            max_size: 4194304
        retry_on_failure:
          max_elapsed_time: 0s
    service:
      extensions: [health_check, file_storage/export-queue]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus, debug]
        # No batch processor: it answers the receiver before the export, so a
        # full exporter queue dropped rows the db-collector had been told were
        # delivered. Without it the receiver answers only once the request is
        # in the exporter's queue (it waits while the queue is full), and the
        # exporter's queue batches instead.
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource]
          exporters: [otlp_http/logs, debug]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: ${env:MY_POD_IP}
                    port: 8888
        resource:
          host.name: ${env:OTEL_K8S_NODE_NAME}
          k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
          k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
          k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
          k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
          k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
