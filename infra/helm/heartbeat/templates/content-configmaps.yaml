{{- if .Values.prometheusRules.enabled }}
{{- /* An optional alert lives in a file of its own, left out when it is off. */}}
{{- $optionalRules := dict "heartbeat-config-reload.rules.yml" (dig "configReloadAlert" "enabled" true .Values.prometheusRules) }}
# Rule files from files/prometheus/rules (and generated/). Prometheus mounts this
# ConfigMap at /etc/prometheus-rules; its config reloader reloads on changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: heartbeat-prometheus-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartbeat.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus-rules
data:
  {{- range $path, $_ := .Files.Glob "files/prometheus/rules/*.yml" }}
  {{- if dig (base $path) true $optionalRules }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  {{- end }}
  {{- range $path, $_ := .Files.Glob "files/prometheus/rules/generated/*.yml" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.grafanaDashboards.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: heartbeat-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartbeat.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-dashboards
    # Discovery label for Grafana's dashboard sidecar in shared Grafanas.
    grafana_dashboard: "1"
data:
  {{- range $path, $_ := .Files.Glob "files/grafana/dashboards/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
