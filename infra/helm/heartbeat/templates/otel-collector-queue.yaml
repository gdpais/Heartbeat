{{- if .Values.otelCollector.enabled }}
{{- $p := .Values.otelCollectorQueue.persistence }}
{{- $sel := dict "root" $ "component" "otel-collector" }}
{{- /* The subchart mounts the volume; this chart owns the claim it names. */}}
{{- $claim := "" }}
{{- range .Values.otelCollector.extraVolumes }}
{{- if eq .name "export-queue" }}
{{- $claim = dig "persistentVolumeClaim" "claimName" "" . }}
{{- end }}
{{- end }}
{{- if and $p.enabled (ne $claim "otel-collector-queue") }}
{{- fail "otelCollectorQueue.persistence.enabled is true, so otelCollector.extraVolumes needs the export-queue volume on the otel-collector-queue claim" }}
{{- end }}
{{- if and (not $p.enabled) (eq $claim "otel-collector-queue") }}
{{- fail "otelCollectorQueue.persistence.enabled is false, so make otelCollector.extraVolumes' export-queue volume an emptyDir instead of the otel-collector-queue claim" }}
{{- end }}
{{- if $p.enabled }}
# The OTel Collector's logs export queue. ReadWriteOnce is enough, because the
# StatefulSet stops the old pod before it starts the new one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otel-collector-queue
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartbeat.componentLabels" $sel | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $p.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
{{- end }}
