# kind (local development and CI). Layer over the chart defaults:
#   helm upgrade --install heartbeat infra/helm/heartbeat -n heartbeat \
#     -f infra/helm/values/kind.yaml [-f infra/helm/values/minimal.yaml] ...
# scripts/kind.sh does this and sets the image tags.
#
# Services are NodePorts that infra/kind/cluster.yaml maps to the same
# 127.0.0.1 ports the Compose stack used.

dbCollector:
  image:
    # The image scripts/kind.sh builds, not the release image the chart
    # defaults to. Loaded into the node with `kind load`; never pulled.
    # scripts/kind.sh sets a content-derived tag, so a stale image cannot hide
    # a code change.
    repository: heartbeat/db-collector
    pullPolicy: Never
  service:
    type: NodePort
    nodePort: 30082
    # Keeps the host's source address on NodePort traffic. With Cluster,
    # kube-proxy masquerades it to the node's pod-network gateway and kindnet
    # drops it, which breaks `make health`.
    externalTrafficPolicy: Local
  networkPolicy:
    # Operator access from outside the pod network: on kind that is the
    # developer's host through the loopback-bound NodePort (infra/kind/
    # cluster.yaml) and containers on the Docker kind network. Pods stay
    # limited to Prometheus. The except range is kind's default pod subnet.
    # The kubelet's probes and the API server's pod proxy (kind-e2e) come
    # from the pod's own node, which NetworkPolicy does not filter.
    #
    # The host -> NodePort path (with externalTrafficPolicy Local above) was
    # verified by hand on kind v0.33 with kindnet; kind-e2e does not cover it,
    # because its cluster has no host port mappings.
    operators:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
            - 10.244.0.0/16

# The same operator access to the engines with a loopback NodePort (make
# health, the demo helpers): Prometheus, Alertmanager and the OTel Collector's
# OTLP ports. Pods stay limited to the components that use each engine. Loki
# has no NodePort: operators reach it with `kubectl port-forward`, which
# NetworkPolicy does not filter. Verified by hand on kind v0.33 with kindnet:
# the host reaches all three through their NodePorts, and Alertmanager's
# times out without this peer. Their Services keep externalTrafficPolicy
# Cluster (Alertmanager's chart has no setting for it), and the host's traffic
# still matched the range in that check, unlike what the collector's comment
# above found earlier. kind-e2e checks that a pod is still refused through
# these NodePorts.
backendNetworkPolicies:
  otelCollector:
    extraPeers:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
            - 10.244.0.0/16
  prometheus:
    extraPeers:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
            - 10.244.0.0/16
  alertmanager:
    extraPeers:
      - ipBlock:
          cidr: 0.0.0.0/0
          except:
            - 10.244.0.0/16

prometheus:
  server:
    retention: 2d
    persistentVolume:
      size: 2Gi
    service:
      type: NodePort
      nodePort: 30090
  alertmanager:
    service:
      type: NodePort
      nodePort: 30093

grafana:
  service:
    type: NodePort
    nodePort: 30300
  # Admin login is admin/admin from the grafana-admin Secret scripts/kind.sh
  # creates. Anonymous viewers are allowed only here, behind loopback ports.
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer

loki:
  singleBinary:
    persistence:
      size: 2Gi

otelCollector:
  service:
    type: NodePort
  ports:
    otlp:
      nodePort: 30317
    otlp-http:
      nodePort: 30318
