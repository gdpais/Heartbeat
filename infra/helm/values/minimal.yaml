# Minimal profile: DB collector, Prometheus, Alertmanager and Grafana. Drops
# Loki and the OpenTelemetry Collector to save CPU and RAM.
# Layer after kind.yaml.

loki:
  enabled: false

otelCollector:
  enabled: false

prometheus:
  scrapeConfigs:
    otel-collector:
      enabled: false
    loki:
      enabled: false

grafana:
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
