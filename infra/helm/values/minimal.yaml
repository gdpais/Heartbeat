# Minimal profile: DB collector, Prometheus, Alertmanager and Grafana. Drops
# Loki, the OpenTelemetry Collector and the OTel gateway to save CPU and RAM.
# Layer after kind.yaml.

otelGateway:
  enabled: false

loki:
  enabled: false

otelCollector:
  enabled: false

prometheus:
  scrapeConfigs:
    otel-gateway:
      enabled: false
    otel-collector:
      enabled: false
    loki:
      enabled: false
  alertmanager:
    config:
      # The default receiver posts to the OTel gateway, which is not deployed.
      receivers:
        - name: default
        - name: deadmans-switch

grafana:
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
