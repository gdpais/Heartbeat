apiVersion: v1
kind: Service
metadata:
  name: patientzero
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patientzero.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "patientzero.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
