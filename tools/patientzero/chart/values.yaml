# PatientZero on kind: tools/patientzero/scripts/patientzero.sh installs this
# chart into the patientzero namespace and sets the image tag and SQL host.

image:
  repository: heartbeat/patientzero
  # Set by the script to a content-derived tag; the image is loaded into the
  # kind node, never pulled.
  tag: ""
  pullPolicy: Never

sql:
  # The sandbox SQL Server (make sqlserver-dev-up): the Docker container's
  # name on the kind network.
  host: ""
  port: 1433
  # Only for the disposable sandbox, whose certificate is self-signed.
  trustServerCertificate: false
  database: patientzero
  logDatabase: patientzero_log
  # Connections each pool (business and logging) may open; requests past
  # it wait for one.
  maxOpenConns: 20
  # Secret with PATIENTZERO_SQL_CREDENTIAL=<login>:<password>, PatientZero's
  # own login (db_owner of the two databases above, nothing else).
  existingSecret: patientzero-sql

# Entry-point requests served at once; past it PatientZero answers 503 with
# Retry-After. 0 turns the limit off.
maxInFlight: 64

# Database role in the logging database that is granted SELECT on the log
# views; the setup script adds the Heartbeat collector's login to it.
logReaderRole: heartbeat_oslog_reader

# Bearer token for the scenario admin endpoints (/admin/, see
# scenarios/README.md): a Secret, never a value here. The setup script
# creates patientzero-admin with a random token. Without a Secret the admin
# endpoints answer 401.
admin:
  existingSecret: patientzero-admin
  key: admin-token

# Where scenario signals are read: Heartbeat's Prometheus, Loki and
# Alertmanager. The setup script points them at the Heartbeat namespace;
# an empty URL makes the scenarios that need it not runnable.
signals:
  prometheusURL: ""
  lokiURL: ""
  alertmanagerURL: ""

# Run journals (JSONL, one per scenario run) go to an emptyDir: they survive
# container restarts, not the pod. The admin endpoint serves them, and
# make patientzero-scenario saves a copy under .tmp/patientzero-scenarios/.
journal:
  sizeLimit: 128Mi

service:
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
