# yaml-language-server: $schema=scenario.schema.json
version: 1
name: slow-sql
description: >-
  The query behind the order list, run by the OrderList screen and the
  GetOrders API, takes 2.5 to 3.5 seconds longer in SQL Server for fifteen
  minutes, as an aggregate that has lost its index does. The platform logs
  each run as slow SQL, SQL Server holds more sessions running, and
  PatientZero burns its latency budget fast and slow:
  OutSystemsLatencyBudgetBurnFast pages in Alertmanager and resolves once the
  query is fast again, and OutSystemsLatencyBudgetBurnSlow fires.
load: steady
steps:
  - name: baseline
    duration: 2m
  - name: slow
    duration: 15m
    fault:
      type: sql-latency
      params:
        entry_points: [OrderList, GetOrders]
        delay: 2500ms
        jitter: 1s
signals:
  # Preconditions. The alerts start quiet, so the run sees them go from
  # resolved to firing. The slowed requests are about 60% of all requests
  # (about 270 a minute), and the burn-rate windows reach back 1 and 6
  # hours: with at most 12,000 requests (about 30 minutes of steady load) in
  # the hour before, the 1-hour slow ratio passes 14.4% within 10 minutes, so
  # the fast burn fires during the fault (on kind, 13 minutes in after 14,400
  # requests); with at most 45,000 in the 6 hours before, the 6-hour one
  # passes 6% within 11 minutes and stays above it for the slow burn's 15
  # (22 minutes in after 41,800). A run right after another slow-sql fails
  # here: wait for its slow burn to resolve (about 50 minutes).
  - name: fast-burn-quiet-before
    alert: OutSystemsLatencyBudgetBurnFast
    labels: {application: PatientZero}
    state: resolved
    step: baseline
    mode: always
    within: 1m50s
  - name: slow-burn-quiet-before
    alert: OutSystemsLatencyBudgetBurnSlow
    labels: {application: PatientZero}
    state: resolved
    step: baseline
    mode: always
    within: 1m50s
  - name: last-hour-leaves-room-for-the-fast-burn
    promql: >-
      sum(increase(heartbeat_outsystems_operations_total{application="PatientZero",log_type=~"screen|mobile_request|integration"}[1h]))
      or vector(0)
    condition: "< 12000"
    step: baseline
    within: 30s
  - name: history-leaves-room-for-the-slow-burn
    promql: >-
      sum(increase(heartbeat_outsystems_operations_total{application="PatientZero",log_type=~"screen|mobile_request|integration"}[6h]))
      or vector(0)
    condition: "< 45000"
    step: baseline
    within: 30s

  # The slow query, seen from both sides: SQL Server runs more sessions at
  # once (a request whose statement is waiting is a running session), and
  # the platform's slow-query rows reach Loki and the slow SQL counter.
  - name: sql-server-runs-more-sessions
    promql: max(heartbeat_sqlserver_sessions{status="running"})
    condition: "> 5"
    step: slow
    within: 3m
  - name: slow-sql-counted
    promql: >-
      sum(rate(heartbeat_outsystems_slow_events_total{application="PatientZero",kind="sql"}[1m]))
    condition: "> 1"
    step: slow
    within: 4m
  - name: slow-sql-in-loki
    logql: >-
      sum(count_over_time({service_name="PatientZero", outsystems_log_type="general"}
      | Module_Name="SLOWSQL" |= "FROM dbo.SalesOrder" [2m]))
    condition: "> 0"
    step: slow
    within: 4m
  - name: slow-ratio-above-fast-burn
    promql: heartbeat:outsystems_request_slow:ratio_rate5m{application="PatientZero"}
    condition: "> 0.144"
    step: slow
    within: 5m

  # The alerts, as Alertmanager has them. The fast burn needs 2 minutes over
  # its threshold (for: 2m) on both its windows, and must fire during the
  # fault, or fast-burn-resolves, which opens at its end, would pass without
  # having seen it fire; it resolves once the 5-minute window no longer
  # holds the slow requests. The slow burn needs 15 minutes (for: 15m); it
  # resolves only once the slow requests leave its 30-minute window, after
  # the run.
  - name: fast-burn-fires
    alert: OutSystemsLatencyBudgetBurnFast
    labels: {application: PatientZero, severity: critical}
    state: firing
    step: slow
    within: 15m
  - name: fast-burn-resolves
    alert: OutSystemsLatencyBudgetBurnFast
    labels: {application: PatientZero}
    state: resolved
    step: slow
    from: end
    within: 10m
  - name: sessions-back-down
    promql: max(heartbeat_sqlserver_sessions{status="running"})
    condition: "< 4"
    step: slow
    from: end
    within: 3m
  - name: slow-ratio-recovers
    promql: heartbeat:outsystems_request_slow:ratio_rate5m{application="PatientZero"}
    condition: "< 0.06"
    step: slow
    from: end
    within: 9m
  - name: slow-burn-fires
    alert: OutSystemsLatencyBudgetBurnSlow
    labels: {application: PatientZero, severity: warning}
    state: firing
    step: slow
    within: 30m
