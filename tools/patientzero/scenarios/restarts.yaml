# yaml-language-server: $schema=scenario.schema.json
version: 1
name: restarts
description: >-
  The db-collector, the OTel Collector and Loki are restarted one after the
  other while the load runs: each pod is deleted and its StatefulSet starts
  a new one. The db-collector resumes from the watermarks it saved, the OTel
  Collector sends the request its queue kept on disk first, and while Loki
  is away the collector waits instead of failing. Loki ends with every row
  PatientZero committed, once, and no restart is long enough to alert:
  neither HeartbeatServiceDown nor OutSystemsLogExportBlocked fires.
load: steady
steps:
  - name: before
    duration: 1m
  - name: db-collector
    duration: 2m
    fault:
      type: restart
      params: {workload: db-collector}
  - name: otel-collector
    duration: 2m
    fault:
      type: restart
      params: {workload: otel-collector}
  - name: loki
    duration: 2m
    fault:
      type: restart
      params: {workload: loki}
  - name: after
    duration: 1m
signals:
  # Both alerts need 2 minutes (for: 2m): HeartbeatServiceDown of up == 0,
  # or of no up series for the db-collector, and OutSystemsLogExportBlocked
  # of a blocked export. Each restart is back within one.
  - name: no-service-down
    alert: HeartbeatServiceDown
    state: resolved
    step: before
    mode: always
    within: 8m
  - name: no-export-blocked
    alert: OutSystemsLogExportBlocked
    state: resolved
    step: before
    mode: always
    within: 8m
  - name: loki-discards-nothing
    alert: LokiDiscardingLogs
    state: resolved
    step: before
    mode: always
    within: 8m
  - name: every-row-once
    delivery:
      log_types: [screen, mobile_request, integration, general, error]
    step: after
    from: end
    within: 5m
