# yaml-language-server: $schema=scenario.schema.json
version: 1
name: collector-outage
description: >-
  The db-collector is down for 4 minutes while the load runs (its StatefulSet
  scaled to 0). Prometheus finds it through DNS on its headless Service, so
  with no pod it scrapes no collector, and HeartbeatServiceDown fires after
  2 minutes. Once it is back the alert resolves, the collector reads the 4
  minutes it missed from the watermarks it saved, and Loki ends with every
  row PatientZero committed, once.
load: steady
steps:
  - name: before
    duration: 1m
  - name: down
    duration: 4m
    fault:
      type: outage
      params: {workload: db-collector}
  - name: after
    duration: 2m
signals:
  # No collector target up. With no pod the DNS lookup finds nothing and the
  # target goes (no up series: HeartbeatServiceDown's absent() rule), unless
  # one of the names Prometheus tries on its DNS search path fails instead
  # of answering NXDOMAIN: then it keeps the target it had, which fails
  # (up == 0: the up == 0 rule). Which one depends on the cluster's DNS; on
  # GitHub's runners it is up == 0.
  - name: collector-target-down
    promql: up{job="db-collector"} == 1
    condition: absent
    step: down
    within: 2m
  - name: collector-down-fires
    alert: HeartbeatServiceDown
    labels: {job: db-collector}
    state: firing
    step: down
    within: 4m
  - name: collector-down-resolves
    alert: HeartbeatServiceDown
    labels: {job: db-collector}
    state: resolved
    step: down
    from: end
    within: 3m
  - name: collector-back
    promql: max(up{job="db-collector"})
    condition: "== 1"
    step: down
    from: end
    within: 2m
  - name: extraction-catches-up
    promql: max(heartbeat_outsystems_extract_lag_seconds{collector="patientzero"})
    condition: "< 120"
    step: down
    from: end
    within: 4m
  - name: every-row-once
    delivery:
      log_types: [screen, mobile_request, integration, general, error]
    step: after
    from: end
    within: 5m
