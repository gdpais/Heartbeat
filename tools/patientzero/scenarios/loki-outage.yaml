# yaml-language-server: $schema=scenario.schema.json
version: 1
name: loki-outage
description: >-
  Loki is down for 3 minutes while the load runs (its StatefulSet scaled to
  0). The OTel Collector holds the one request it was sending and takes no
  more, so the db-collector waits for it: its PatientZero target stays up,
  heartbeat_outsystems_export_blocked is 1 and the backlog grows in the
  logging database, not in memory. Once Loki is back the backlog drains and
  Loki ends with every row PatientZero committed, once.
load: steady
steps:
  - name: before
    duration: 1m
  - name: down
    duration: 3m
    fault:
      type: outage
      params: {workload: loki}
  - name: after
    duration: 2m
signals:
  - name: export-blocked
    promql: max(heartbeat_outsystems_export_blocked{collector="patientzero"})
    condition: "== 1"
    step: down
    within: 2m
  - name: target-stays-up
    promql: min(heartbeat_collector_target_up{collector="patientzero"})
    condition: "== 1"
    step: down
    mode: always
    within: 3m
  - name: extraction-catches-up
    promql: max(heartbeat_outsystems_extract_lag_seconds{collector="patientzero"})
    condition: "< 120"
    step: down
    from: end
    within: 4m
  - name: every-row-once
    delivery:
      log_types: [screen, mobile_request, integration, general, error]
    step: after
    from: end
    within: 5m
