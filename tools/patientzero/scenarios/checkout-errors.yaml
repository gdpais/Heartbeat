# yaml-language-server: $schema=scenario.schema.json
version: 1
name: checkout-errors
description: >-
  Half of the Reactive checkout's PlaceOrder calls fail for three minutes,
  each with an error row under its Request_Key. Heartbeat's derived error
  ratio for the PlaceOrder operation rises, the injected errors reach Loki
  in PatientZero's error log, and the ratio falls back once the fault ends.
load: steady
steps:
  - name: baseline
    duration: 1m
  - name: errors
    duration: 3m
    fault:
      type: errors
      params:
        entry_points: [PlaceOrder]
        ratio: 0.5
        message: checkout-errors
signals:
  # About 3% of orders fail without the fault (k6 orders an unknown product),
  # so the ratio is read against thresholds well clear of that.
  - name: error-ratio-rises
    promql: >-
      sum(rate(heartbeat_outsystems_operations_total{application="PatientZero",log_type="mobile_request",operation="PlaceOrder",outcome="error"}[1m]))
      / sum(rate(heartbeat_outsystems_operations_total{application="PatientZero",log_type="mobile_request",operation="PlaceOrder"}[1m]))
    condition: "> 0.3"
    step: errors
    within: 4m
  - name: injected-errors-in-loki
    logql: >-
      sum(count_over_time({service_name="PatientZero", outsystems_log_type="error"}
      |= "injected by scenario: checkout-errors" [2m]))
    condition: "> 0"
    step: errors
    within: 4m
  - name: error-ratio-recovers
    promql: >-
      sum(rate(heartbeat_outsystems_operations_total{application="PatientZero",log_type="mobile_request",operation="PlaceOrder",outcome="error"}[1m]))
      / sum(rate(heartbeat_outsystems_operations_total{application="PatientZero",log_type="mobile_request",operation="PlaceOrder"}[1m]))
    condition: "< 0.2"
    step: errors
    from: end
    within: 4m
