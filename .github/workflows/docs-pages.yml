name: docs-pages

# Builds the HTML docs from master's Markdown and publishes them to GitHub
# Pages. The site is never committed, so it cannot go stale.
# Requires Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "services/*/README.md"
      - "tools/docsite/**"
      - "Makefile"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/docsite/go.mod
          cache-dependency-path: tools/docsite/go.sum
      - name: Build the HTML docs site
        run: make docs-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only the deploy job publishes, so only it gets the Pages token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
