name: db-collector-ci

on:
  push:
    branches: [master, db-collectors, otel-integrations]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run Go tests
        run: make test
      - name: Run race checks
        run: make test-race
      - name: Run Go static checks
        run: make vet
      - name: Validate Prometheus rules
        run: make rules-check
      - name: Run isolated PostgreSQL integration tests
        run: make test-integration

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install pinned kind, kubectl, Helm 4 and Helm 3
        run: |
          make install-tools
          echo "$PWD/.tmp/bin" >> "$GITHUB_PATH"
      - name: Fetch chart dependencies (Chart.lock)
        run: make chart-deps
      - name: Lint and render every profile with Helm 4
        run: make chart-check
      - name: Render every profile with Helm 3
        run: make chart-check HELM="$PWD/.tmp/bin/helm3"

  kind-e2e:
    name: kind end-to-end
    runs-on: ubuntu-latest
    needs: chart
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install pinned kind, kubectl and Helm
        run: |
          make install-tools
          echo "$PWD/.tmp/bin" >> "$GITHUB_PATH"
      - name: Check tool versions
        run: make tools-check
      - name: Fetch chart dependencies (Chart.lock)
        run: make chart-deps
      # Creates its own kind cluster with the pinned node image, builds and
      # loads both images, starts a SQL Server container and runs the ADR 0003
      # acceptance checks; removes everything it created on exit.
      - name: Run acceptance checks on kind
        run: make kind-e2e
