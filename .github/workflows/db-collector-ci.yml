name: db-collector-ci

on:
  push:
    branches: [master, db-collectors, otel-integrations]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate docker compose
        run: docker compose -f infra/docker-compose.yml config
      - name: Run Go tests
        run: make test
      - name: Run race checks
        run: make test-race
      - name: Run Go static checks
        run: make vet
      - name: Validate Prometheus rules
        run: make rules-check
      - name: Run isolated PostgreSQL integration tests
        run: make test-integration
